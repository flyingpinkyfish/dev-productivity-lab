name: Collect data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}
        run: python scripts/collect.py
      - name: Publish to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch origin data
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . > /dev/null
          fi
          mkdir -p data
          cp data_out/prs.json data_out/runs.json data/
          if [ -f data_out/probe.json ]; then
            cat data_out/probe.json >> data/probes.jsonl
            echo >> data/probes.jsonl
          fi
          git add data
          git diff --cached --quiet || git commit -m "Collect data"
          git push origin data
